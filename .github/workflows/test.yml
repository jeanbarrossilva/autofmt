name: Test
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Zig compiler
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: zig build test
